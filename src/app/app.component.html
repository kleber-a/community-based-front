<div class="app-shell">
  <app-sidebar></app-sidebar>

  <main class="workspace">
    <header class="workspace-hero">
      <div>
        <span class="eyebrow">Visão geral</span>
        <h2>Base Comunitária</h2>
        <p>Painel principal da campanha, com acesso direto às páginas do menu.</p>
      </div>
      <div class="hero-actions">
        <button type="button" class="theme-toggle" (click)="toggleTheme()" [attr.aria-pressed]="isLightTheme">
          <span class="theme-toggle__icon" aria-hidden="true">
            @if (isLightTheme) {
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M12 17.75a5.75 5.75 0 1 1 5.75-5.75A5.76 5.76 0 0 1 12 17.75Zm0-9.5a3.75 3.75 0 1 0 3.75 3.75A3.75 3.75 0 0 0 12 8.25Zm0-4.25a1 1 0 0 1 1 1V6a1 1 0 1 1-2 0V5a1 1 0 0 1 1-1Zm0 14a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1Zm7.25-7.25a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2h-1a1 1 0 0 1-1-1Zm-14.5 0a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2h-1a1 1 0 0 1-1-1Zm12.02-5.27a1 1 0 0 1 1.41 0l.71.71a1 1 0 1 1-1.41 1.41l-.71-.71a1 1 0 0 1 0-1.41Zm-9.54 9.54a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1-1.41 1.41l-.71-.71a1 1 0 0 1 0-1.41Zm9.54 1.42a1 1 0 0 1 0 1.41l-.71.71a1 1 0 1 1-1.41-1.41l.71-.71a1 1 0 0 1 1.41 0Zm-9.54-9.55a1 1 0 0 1 0 1.41l-.71.71A1 1 0 1 1 6.05 7.3l.71-.71a1 1 0 0 1 1.41 0Z" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M20.25 15.12A8.5 8.5 0 0 1 8.88 3.75a1 1 0 0 0-1.18-1.32A10.5 10.5 0 1 0 21.58 16.3a1 1 0 0 0-1.33-1.18ZM12 20a8 8 0 0 1-2.42-.37A10.49 10.49 0 0 0 16.63 12 10.49 10.49 0 0 0 20 13.23 8 8 0 0 1 12 20Z" />
              </svg>
            }
          </span>
          <span>{{ themeToggleLabel }}</span>
        </button>
      </div>
    </header>

    <section class="workspace-content">
      <router-outlet />
    </section>
  </main>
</div>
