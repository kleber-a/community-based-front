<header class="page-header">
  <div class="page-header__title">
    <span class="page-kicker">{{ kicker }}</span>
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
  </div>

  <div class="page-header__actions">
    <input type="file" accept=".xlsx,.xls" (change)="selecionarArquivoD($event)">
    <button (click)="enviarD()">
      Importar Demandas
    </button>
    <input type="file" accept=".xlsx,.xls" (change)="selecionarArquivo($event)">
    <button (click)="enviar()">
      Importar Pessoa
    </button>
    @if (actionLabel) {
    <button type="button" class="primary-action" (click)="actionClick.emit()">
      @if (actionIcon) {
      <span class="primary-action__icon" aria-hidden="true">{{ actionIcon }}</span>
      }
      <span>{{ actionLabel }}</span>
    </button>
    }
  </div>
</header>
