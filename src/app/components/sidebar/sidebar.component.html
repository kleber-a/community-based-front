  <aside class="sidebar">
    <section class="brand-card" aria-label="Base Comunitária">
      <div class="brand-mark" aria-hidden="true">

          <path d="M3 6.75A2.75 2.75 0 0 1 5.75 4h8.5A2.75 2.75 0 0 1 17 6.75v1.5h1.75A2.25 2.25 0 0 1 21 10.5v3.25A2.25 2.25 0 0 1 18.75 16H17v1.25A2.75 2.75 0 0 1 14.25 20h-8.5A2.75 2.75 0 0 1 3 17.25v-10.5Zm2.75-.75a.75.75 0 0 0-.75.75v10.5c0 .414.336.75.75.75h8.5a.75.75 0 0 0 .75-.75V6.75a.75.75 0 0 0-.75-.75h-8.5Zm13.5 4.5h-1.25v4.5h1.25a.75.75 0 0 0 .75-.75v-3a.75.75 0 0 0-.75-.75Z" />

        <div class="avatar">MM</div>

      <div>
        <h1>{{ appName }}</h1>
        <p>{{ appSubtitle }}</p>
      </div>
    </section>

    <nav class="nav-section" aria-label="Navegação principal">
      <span class="section-label">Navegação</span>
      <ul class="nav-list">
        @for (item of navigationItems; track item.id) {
          <li>
            <a
              class="nav-item"
              [routerLink]="item.disable ? null : item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              [attr.aria-current]="null"
              [class.disabled]="item.disable"
              [attr.aria-disabled]="item.disable"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path [attr.d]="item.icon"></path>
              </svg>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <section class="user-card" aria-label="Usuário atual">
      <div class="avatar" aria-hidden="true">MM</div>
      <div>
        <strong>Marcelo Marcelinho</strong>
        <p>Pré-candidato</p>
      </div>
    </section>
  </aside>
